<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tab icon is the page mark. The rasters come first and the theme-aware
      SVG last: Google Search only accepts raster icons (BMP, GIF, ICO, PNG,
      JPEG, PPM, TIFF) and wants one larger than 48px, so a crawler reads the
      192px PNG while every browser still picks the SVG. The ICO declares its
      real sizes — `sizes="any"` claims to be scalable, ties with the SVG and
      wins by position, which would cost the themed tab icon. `setFavicon()`
      rewrites the SVG entry at runtime, never a raster fallback.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://felipeinoue.com/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Felipe Inoue — backend and tooling developer. Projects, experience and skills."
    />
    <title>Felipe Inoue</title>
    <!--
      Apply the stored theme before first paint, so there is no flash of the
      wrong palette. The keys and values mirror src/theme/presets.ts — keep
      them in sync (a test pins the two lists together). Colours stay in CSS;
      this only sets two data attributes. `system` is gone, so a leftover value
      falls through to the default reading.
    -->
    <script>
      ;(() => {
        try {
          const root = document.documentElement
          const presets = ['studio', 'paper', 'terminal', 'violet', 'ember']
          const modes = ['light', 'dark']
          let preset = localStorage.getItem('portfolio.v1.theme')
          let mode = localStorage.getItem('portfolio.v1.mode')
          if (!presets.includes(preset)) preset = 'studio'
          if (!modes.includes(mode)) mode = 'dark'
          root.dataset.theme = preset
          root.dataset.mode = mode
        } catch {
          /* first paint falls back to the :root palette */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

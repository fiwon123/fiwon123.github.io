<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Felipe Inoue">
  <!-- The tab icon cannot read the page's data-theme/data-mode, so it follows the
       OS light/dark preference and keeps the studio accent. The dark block is the
       base: the site's default reading, and what the raster fallbacks render. -->
  <style>
    :root {
      --color-surface: #161b22;
      --color-border: #2a323d;
      --color-accent: #6ea8fe;
    }
  </style>
  <style media="(prefers-color-scheme: light)">
    :root {
      --color-surface: #eef1f5;
      --color-border: #cbd3dd;
      --color-accent: #1d4ed8;
    }
  </style>
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="7"
    fill="var(--color-surface)"
    stroke="var(--color-border)"
    stroke-width="1.5"
  />
  <path
    d="M7.07 19.25 A9.5 4.2 -20 0 1 24.93 12.75 A9.5 4.2 -20 0 1 7.07 19.25"
    fill="none"
    stroke="var(--color-accent)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M16 14.5 a1.5 1.5 0 0 0 0 3 a1.5 1.5 0 0 0 0 -3"
    fill="none"
    stroke="var(--color-accent)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
